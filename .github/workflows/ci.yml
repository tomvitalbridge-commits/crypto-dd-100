name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: dd100 validate
      - run: pytest -q
      - name: examples still produce the documented verdicts
        run: |
          dd100 run examples/halcyon/manifest.yaml | grep CONDITIONAL
          dd100 run examples/moonvault/manifest.yaml | grep REJECT
          dd100 run examples/hyperliquid/manifest.yaml | grep CONDITIONAL
      - name: metrics catalog is in sync with the framework
        run: |
          { echo "# Metrics catalog"; echo; echo "Generated by \`dd100 metrics\` from framework/dimensions.yaml and framework/red_flags.yaml — regenerate rather than edit."; echo; dd100 metrics; } > /tmp/catalog.md
          diff /tmp/catalog.md skills/crypto-dd/references/metrics-catalog.md
