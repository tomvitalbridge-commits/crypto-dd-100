# MegaETH (MEGA) — judgment scores from public sources dated on or before 2026-04-30.
# Every score cites evidence ids in evidence/*.json. Where dated public sources
# were not enough, the dimension is left `pending` with what is missing.
# T02, M05 and L07 are human-only and are deliberately not filled.
assessments:

# --- T Team & Governance
- {id: T01, status: pending, rationale: "missing: a dated source on the founders' prior ventures and their outcomes; dated sources name only Namik Muduroglu as a founding contributor and give a 23-person team"}
- {id: T03, score: 2, confidence: medium, evidence: [MEGA-06, MEGA-18], assessor: "agent:claude", rationale: "23 team members per the white paper; 12 named contributors committed to the public client repos in the 90 days to 30 Apr, so engineering has some redundancy; no disclosed succession or security/ops leadership."}
- {id: T04, score: 3, confidence: high, evidence: [MEGA-17, MEGA-18, MEGA-16], assessor: "agent:claude", rationale: "In-house team built MegaEVM, the SALT state trie and a stateless validator, open-sourced and externally tested by BlockSec; 10ms mini-block design documented. No public consensus/sequencer spec."}
- {id: T05, score: 3, confidence: medium, evidence: [MEGA-06, MEGA-11, MEGA-12], assessor: "agent:claude", rationale: "No enforcement action or misconduct allegation found; the one public failure (Nov-2025 pre-deposit multisig error) was operational, admitted as 'sloppy', with a full refund announced. Registries and court records not searched, so not 4."}
- {id: T07, score: 1, confidence: medium, evidence: [MEGA-06, MEGA-04, MEGA-05], assessor: "agent:claude", rationale: "Governance is not live; MegaLabs runs the single sequencer and can adjust parameters through multisig; decentralisation is a KPI with no date, and unmet KPI tokens may later go to an undefined vote."}
- {id: T08, status: pending, rationale: "missing: published treasury/foundation addresses and any treasury report; none found in dated sources. Foundation's 7.5% reserve and VC 14.7% custody not disclosed"}
- {id: T09, score: 3, confidence: high, evidence: [MEGA-06, MEGA-02, MEGA-16], assessor: "agent:claude", rationale: "Seed led by Dragonfly with Vitalik Buterin and Joseph Lubin; later backers include Anagram, Kraken Ventures, Maven11, Robot Ventures. GSR and Wintermute are both investors and market makers, which the MM-terms review (M05) must check."}

# --- P Product & Technology
- {id: P01, score: 2, confidence: medium, evidence: [MEGA-02, MEGA-07, MEGA-01], assessor: "agent:claude", rationale: "Real-time EVM execution is a real need for trading and gaming apps, but demand at TGE was shaped by the token KPIs: the 10 qualifying apps were self-incubated and USDM jumped from ~$62.9M to >$300M in the countdown week."}
- {id: P02, score: 2, confidence: high, evidence: [MEGA-13, MEGA-14, MEGA-15], assessor: "agent:claude", rationale: "Public mainnet since 9 Feb 2026 — under 3 months of production at listing; sequencer decentralisation, staking and proximity markets are still roadmap."}
- {id: P03, score: 3, confidence: high, evidence: [MEGA-17, MEGA-19, MEGA-16], assessor: "agent:claude", rationale: "Execution layer is original (MegaEVM with a dual gas model, SALT in-memory trie, stateless validation, 10ms mini-blocks); settlement and bridging reuse OP Stack contracts."}
- {id: P04, score: 2, confidence: medium, evidence: [MEGA-17, MEGA-06, MEGA-16], assessor: "agent:claude", rationale: "One high-spec sequencer (100+ cores, TB-scale RAM) run by MegaLabs; BlockSec found DoS paths at the 10B gas limit, mitigated by a 200M compute-gas cap rather than fixed. Liveness limits are acknowledged in the white paper."}
- {id: P05, score: 1, confidence: medium, evidence: [MEGA-06, MEGA-11, MEGA-16, MEGA-01], assessor: "agent:claude", rationale: "Single MegaLabs sequencer with no described failover; the economic model rests on Ethena's USDM (BUIDL-backed) yield; a third-party bridge provider outage disrupted the Nov-2025 pre-deposit."}
- {id: P08, score: 2, confidence: medium, evidence: [MEGA-04, MEGA-13, MEGA-11, MEGA-06], assessor: "agent:claude", rationale: "Mainnet shipped on the announced 9 Feb date, but the USDm pre-deposit campaign was aborted and refunded, and the white paper gives conflicting dates for testnet and TGE."}
- {id: P09, score: 2, confidence: high, evidence: [MEGA-18, MEGA-17], assessor: "agent:claude", rationale: "MegaEVM, SALT and the stateless validator are public (Apache/MIT) with 155 commits in the 90 days to 30 Apr; the sequencer node and token/staking contracts were not found as public repos."}
- {id: P10, score: 2, confidence: medium, evidence: [MEGA-19, MEGA-06], assessor: "agent:claude", rationale: "Developer docs list contract addresses and bridge usage; no published threat model, sequencer spec or admin-key documentation."}

# --- S Security
- {id: S02, score: 2, confidence: high, evidence: [MEGA-17], assessor: "agent:claude", rationale: "BlockSec's 4 High MegaEVM findings: 1 Fixed, 3 Confirmed and mitigated by a compute-gas cap rather than code fixes; SALT Medium fixed. Spearbit/Sherlock remediation is claimed but unpublished."}
- {id: S05, score: 2, confidence: medium, evidence: [MEGA-11, MEGA-06], assessor: "agent:claude", rationale: "Admin powers sit in MegaLabs multisigs with undisclosed signers and thresholds; the one observed (pre-deposit) was a 4-signer team Safe whose cap-raise was mis-set to 4-of-4 and executed early by an outsider."}
- {id: S06, score: 3, confidence: low, evidence: [MEGA-06], assessor: "agent:claude", rationale: "White paper states fixed 10B supply with no minting function and no pause, but also describes emergency multisig admin functions; not verified on-chain."}
- {id: S08, score: 3, confidence: medium, evidence: [MEGA-11, MEGA-12, MEGA-20], assessor: "agent:claude", rationale: "No exploit found; the Nov-2025 pre-deposit incident (>$400M deposited, no reported loss) was disclosed within two days with a full refund announced, the refund contract going through audit first."}
- {id: S09, status: pending, rationale: "missing: oracle design of the main apps (RedStone Bolt is named in MEGA-16) and USDM/Aave-style collateral parameters; chain itself uses no price oracle"}
- {id: S10, score: 2, confidence: low, evidence: [MEGA-19, MEGA-11], assessor: "agent:claude", rationale: "Assets enter via the canonical OP Stack bridge (proxy contracts) and Ethena-issued USDM; upgrade admin and delay of the bridge were not established from dated sources."}

