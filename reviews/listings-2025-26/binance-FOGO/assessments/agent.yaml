# --- C Competition & Moat
- {id: C01, status: pending, rationale: "missing: dated pre-listing sizing of the on-chain trading / high-performance L1 segment"}
- {id: C03, status: pending, rationale: "missing: no share history; mainnet days old"}
- {id: C04, score: 1, confidence: medium, evidence: [FOGO-06, FOGO-04], assessor: "agent:claude", rationale: "The only edge is latency from validator co-location and Firedancer; Solana is adopting the same client (~21% of stake), and no retention has been shown."}
- {id: C05, score: 1, confidence: medium, evidence: [FOGO-17, FOGO-04], assessor: "agent:claude", rationale: "Fogo is itself an Apache-licensed fork of open-source Firedancer; no liquidity or integrations are sticky yet."}
- {id: C06, score: 2, confidence: medium, evidence: [FOGO-05, FOGO-06], assessor: "agent:claude", rationale: "40ms blocks and gasless Sessions set it apart from Solana today, but both are copyable and Solana's Firedancer rollout narrows the gap."}
- {id: C07, status: pending, rationale: "missing: market FDV at listing (only the $0.035 Prime Sale price, ~$350M FDV, FOGO-07) and dated peer valuations"}
- {id: C08, score: 1, confidence: medium, evidence: [FOGO-06, FOGO-04], assessor: "agent:claude", rationale: "The incumbent, Solana, is rolling out the same Firedancer client (~21% of stake), which goes straight at Fogo's speed pitch."}
- {id: C09, score: 2, confidence: low, evidence: [FOGO-15, FOGO-06, FOGO-05], assessor: "agent:claude", rationale: "Wormhole is confirmed live by Wormhole; Pyth and the DEX/lending partners are announced but not observed live."}
- {id: C10, score: 2, confidence: medium, evidence: [FOGO-08, FOGO-12], assessor: "agent:claude", rationale: "Adds another SVM L1 to sectors Binance already covers; the Binance Wallet Prime Sale and Alpha launch tie it to Binance's own funnel."}

