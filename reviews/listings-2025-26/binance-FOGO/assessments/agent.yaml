- {id: M06, score: 3, confidence: low, evidence: [FOGO-10, FOGO-12], assessor: "agent:claude", rationale: "No prior spot venue except Binance Alpha; Binance, OKX, Gate and KuCoin all list it on 15 Jan, reported by one secondary source."}
- {id: M07, status: pending, rationale: "missing: whether perpetual or pre-market futures existed at listing, with OI and funding"}
