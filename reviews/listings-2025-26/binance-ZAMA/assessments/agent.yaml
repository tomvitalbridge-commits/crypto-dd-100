# Zama (ZAMA) — judgment scores from public sources, as of 2026-02-02 (listing day).
# Every score cites evidence ids in evidence/*.json. Where public sources were
# not enough, the dimension is left `pending` with what is missing.
# T02, M05, L07 are human-only and deliberately absent.
assessments:

# --- T Team & Governance
- {id: T01, score: 3, confidence: medium, evidence: [ZAMA-04, ZAMA-15], assessor: "agent:claude", rationale: "CEO Rand Hindi founded Snips, which was acquired; CTO Pascal Paillier co-invented the Paillier scheme. Zama itself has shipped FHE libraries since 2020, but no crypto product at scale yet."}
- {id: T03, score: 3, confidence: medium, evidence: [ZAMA-08, ZAMA-22], assessor: "agent:claude", rationale: "Team of >100 with ~40 PhDs (project figure via press); 48 distinct non-bot committers across fhevm, tfhe-rs and kms in the 90 days to listing."}
- {id: T04, score: 4, confidence: high, evidence: [ZAMA-04, ZAMA-22, ZAMA-25], assessor: "agent:claude", rationale: "CTO is a recognised cryptographer; the in-house team maintains the TFHE-rs library and the fhEVM stack with published specs and a patent portfolio."}
- {id: T05, status: pending, rationale: "missing: court-record, regulator (AMF/SEC/FCA) and sanctions-list searches for Zama SAS, Rand Hindi and Pascal Paillier; none could be run in this review"}
- {id: T07, score: 1, confidence: medium, evidence: [ZAMA-20, ZAMA-21, ZAMA-06, ZAMA-19], assessor: "agent:claude", rationale: "At listing an Aragon DAO acting through a 3/5 multisig with unnamed signers holds the token and bridge admin roles; operator-majority governance is announced, and token holders have no vote. No dated decentralisation milestones were found."}
- {id: T08, status: pending, rationale: "missing: treasury and growth wallet addresses, and any treasury report reconciling the ~$55M of sale proceeds and the 30% Treasury/Growth allocation"}
- {id: T09, score: 4, confidence: medium, evidence: [ZAMA-04, ZAMA-01, ZAMA-08], assessor: "agent:claude", rationale: "Series A led by Multicoin and Protocol Labs, Series B by Blockchange and Pantera at a >$1B valuation; 29 institutional backers reported."}

# --- P Product & Technology
- {id: P01, score: 2, confidence: medium, evidence: [ZAMA-02, ZAMA-17, ZAMA-14], assessor: "agent:claude", rationale: "On-chain confidentiality is a real gap, but at listing the usage evidence was a confidential USDT transfer, one payroll pilot (Bron) and a token auction. That shows demand for the token, not for paid protocol usage."}
- {id: P02, score: 2, confidence: high, evidence: [ZAMA-14, ZAMA-03, ZAMA-17], assessor: "agent:claude", rationale: "Ethereum mainnet went live in late Dec 2025, about 5 weeks before listing, and staking on 19 Jan 2026; other EVM chains and Solana were still on the roadmap."}
- {id: P03, score: 4, confidence: high, evidence: [ZAMA-25, ZAMA-22, ZAMA-23], assessor: "agent:claude", rationale: "Original FHE stack (TFHE-rs, coprocessors, threshold-MPC KMS) developed in-house and patented, not a fork."}
- {id: P04, score: 2, confidence: medium, evidence: [ZAMA-23, ZAMA-15], assessor: "agent:claude", rationale: "Documented trust model: 13-node KMS tolerating up to 1/3 malicious nodes, majority-honest coprocessors. Throughput is ~20 TPS per chain and slashing is still 'eventual'; there is no production stress history yet."}
- {id: P05, score: 2, confidence: medium, evidence: [ZAMA-23, ZAMA-14, ZAMA-19], assessor: "agent:claude", rationale: "Every KMS node runs by default in AWS Nitro Enclaves on AWS infrastructure; the Gateway is an Arbitrum rollup; token bridging relies on LayerZero."}
- {id: P08, score: 3, confidence: medium, evidence: [ZAMA-15, ZAMA-14, ZAMA-17], assessor: "agent:claude", rationale: "The Q4 2025 Ethereum mainnet target was met (late Dec 2025) and staking and the auction shipped in January; multi-chain items were not yet due."}
- {id: P09, score: 3, confidence: high, evidence: [ZAMA-22, ZAMA-25, ZAMA-26], assessor: "agent:claude", rationale: "fhevm, tfhe-rs and kms are public. The token, staking and governance contracts were pulled from the public repo on 23 Jan 2026, and commercial use needs a patent licence."}
- {id: P10, score: 3, confidence: medium, evidence: [ZAMA-23, ZAMA-15], assessor: "agent:claude", rationale: "Architecture docs state trust assumptions for the KMS, coprocessors and Gateway, with integration guides; no formal threat model or consensus spec was found."}

# --- S Security
- {id: S02, status: pending, rationale: "missing: any pre-listing audit report (scope, commit, findings) for the deployed token, staking, governance, host/gateway contracts and KMS"}
- {id: S05, score: 2, confidence: medium, evidence: [ZAMA-19, ZAMA-20, ZAMA-21], assessor: "agent:claude", rationale: "Admin powers sit with an Aragon DAO operated by a 3/5 multisig whose signers are not disclosed; membership was still being changed during the setup phase (20 and 30 Jan)."}
- {id: S06, score: 1, confidence: high, evidence: [ZAMA-18, ZAMA-06], assessor: "agent:claude", rationale: "mint() has no cap and is gated only by a role the DAO admin grants; emissions of 5% of supply a year are by design. There is no transfer freeze or blacklist."}
- {id: S08, status: pending, rationale: "missing: incident-database search; with ~5 weeks of mainnet, the absence of reported incidents is not yet evidence"}
- {id: S09, status: pending, rationale: "missing: how the USD-to-ZAMA fee oracle is sourced and guarded"}
- {id: S10, score: 2, confidence: medium, evidence: [ZAMA-19, ZAMA-07, ZAMA-09], assessor: "agent:claude", rationale: "ZAMA lives on Ethereum, BSC, the Gateway rollup and Solana. Non-Ethereum supply is bridged via LayerZero OFT (lock on Ethereum, mint elsewhere), with the adapter owned by the DAO."}

# --- K Tokenomics
- {id: K01, score: 3, confidence: medium, evidence: [ZAMA-05, ZAMA-07, ZAMA-06], assessor: "agent:claude", rationale: "Protocol fees are paid in ZAMA and burned, and operators must stake ZAMA. The burn mechanism is live, but fee volume at listing is unknown and probably small next to 5% emissions."}
- {id: K09, status: pending, rationale: "missing: vesting-contract addresses for the Team, VC, Angel, Treasury and Growth allocations; genesis supply was minted to the DAO (ZAMA-19), so whether vesting is enforced on-chain is unknown"}
- {id: K10, score: 2, confidence: medium, evidence: [ZAMA-02, ZAMA-01, ZAMA-09], assessor: "agent:claude", rationale: "Distribution was a paid sealed-bid auction (11,103 bidders, fully unlocked) plus a 6% TGE-campaign bucket including 55M ZAMA for Binance campaigns; no retention evidence exists yet."}

