# --- C Competition & Moat
- {id: C04, score: 2, confidence: medium, evidence: [ZAMA-25, ZAMA-04, ZAMA-23], assessor: "agent:claude", rationale: "The moat is technical and legal (patents, an FHE research team, the ERC-7984 standard with OpenZeppelin); it has not yet been tested by users choosing between rivals."}
- {id: C05, score: 4, confidence: medium, evidence: [ZAMA-25], assessor: "agent:claude", rationale: "Code is source-available, but commercial use requires Zama's patent licence, which makes a commercial fork legally impractical."}
- {id: C06, score: 3, confidence: medium, evidence: [ZAMA-15, ZAMA-23], assessor: "agent:claude", rationale: "FHE adds composable encrypted state to existing chains without a new L1, unlike TEE chains (Secret, Oasis) or ZK L2s (Aztec); performance is the trade-off (~20 TPS)."}
- {id: C07, score: 2, confidence: low, evidence: [ZAMA-04], assessor: "agent:claude", rationale: "$550M auction FDV is ~4.4× the closest listed FHE peer (Mind Network, ~$125M), with no usage metrics to justify the premium beyond funding and team."}
- {id: C09, score: 2, confidence: medium, evidence: [ZAMA-17, ZAMA-04, ZAMA-23], assessor: "agent:claude", rationale: "Bron payroll and the OpenZeppelin library are observable; other named partners (Conduit, the Zaiffer JV) are infrastructure or affiliates, and no on-chain flow volumes were found."}
- {id: C10, score: 3, confidence: low, evidence: [ZAMA-09, ZAMA-04], assessor: "agent:claude", rationale: "Adds FHE confidential-compute infrastructure, which major venues barely cover; an FHE peer (Mind Network) already exists in the market."}

