- {id: K01, score: 3, confidence: medium, evidence: [LIT-01, LIT-06, LIT-07], assessor: "agent:claude", rationale: "Team says all product value accrues to LIT; treasury LIT balance rose (implied buybacks) and LIT staking became mandatory for LLP access on 14 Jan. Buyback size and rules are discretionary and unpublished."}
- {id: K09, score: 1, confidence: medium, evidence: [LIT-01, LIT-16, LIT-06], assessor: "agent:claude", rationale: "Total supply is on-chain, but no vesting-contract addresses for the 50% team/investor share or the ecosystem reserve were published, and LIT was not yet withdrawable from Lighter on 2 Jan."}
- {id: K10, score: 1, confidence: medium, evidence: [LIT-18, LIT-19, LIT-09, LIT-10, LIT-28], assessor: "agent:claude", rationale: "Points rewarded volume that analysts tie to farming (volume/OI ~27 in beta); ~$250M left in 24h after the drop and farmers were moving on by 12 Jan; ~75% of addresses still held on day 1 (unnamed analysts)."}

