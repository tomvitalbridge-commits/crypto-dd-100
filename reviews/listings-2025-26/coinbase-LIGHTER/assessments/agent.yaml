# Lighter (LIT) — judgment scores from public sources published on or before
# 2026-01-15 (Coinbase listing date). Every score cites evidence ids in
# evidence/*.json. Where dated public sources were not enough, the dimension is
# left `pending` with what is missing. T02, M05 and L07 are human-only.
assessments:

# --- T Team & Governance
- {id: T01, score: 3, confidence: medium, evidence: [LIT-16, LIT-15, LIT-06], assessor: "agent:claude", rationale: "Founder's career (Citadel, Head of ML at Quora, VP Eng at Addepar, prior AI start-up) is documented, and Lighter led perp-DEX monthly volume within ~3 months of public mainnet; the founder's earlier company outcome is not documented."}
- {id: T03, score: 2, confidence: low, evidence: [LIT-16], assessor: "agent:claude", rationale: "A ~28-engineer team is reported only in a write-up the team reviewed; public communication centres on the CEO and no ops/security leads or succession are documented."}
- {id: T04, score: 3, confidence: high, evidence: [LIT-20, LIT-21, LIT-26], assessor: "agent:claude", rationale: "In-house team designed custom ZK circuits for verifiable matching, reviewed by zkSecurity since 2024, and published the prover code in Dec 2025; no specs or research papers of its own."}
- {id: T05, score: 2, confidence: medium, evidence: [LIT-08, LIT-09], assessor: "agent:claude", rationale: "Open allegations at TGE: an LLP-linked 5-wallet cluster received ~10M LIT and sold ~2.76M, and a market maker reportedly got >$24M of LIT; the CEO said the wallets were a third-party LP with no undisclosed ties. No enforcement found in coverage."}
- {id: T07, score: 1, confidence: high, evidence: [LIT-01, LIT-24], assessor: "agent:claude", rationale: "A US C-Corp issues LIT and runs the protocol; there is no token-holder vote, the network governor is a single EOA, and decentralisation via staking is described only as 'progressive'."}
- {id: T08, score: 2, confidence: medium, evidence: [LIT-06, LIT-01], assessor: "agent:claude", rationale: "Treasury Account #0 is public on the explorer (180,588 LIT on 5 Jan), but no buyback amounts, reports, or custody details for the 250M-LIT ecosystem reserve are published."}
- {id: T09, score: 4, confidence: medium, evidence: [LIT-14, LIT-16], assessor: "agent:claude", rationale: "Nov-2025 round led by Founders Fund and Ribbit with Haun and Robinhood; a16z, Dragonfly, Lightspeed, Coatue and Coinbase also listed as backers. Investor token warrants (24% of supply) make them a 2027+ supply source."}

# --- P Product & Technology
- {id: P01, score: 3, confidence: medium, evidence: [LIT-16, LIT-17, LIT-18], assessor: "agent:claude", rationale: "Premium (low-latency) accounts pay real fees, ~$105–200M annualised; but retail volume is free and was largely farmed for points, so demand outside incentives is unproven."}
- {id: P02, score: 2, confidence: high, evidence: [LIT-12, LIT-06, LIT-25], assessor: "agent:claude", rationale: "Public mainnet since early Oct 2025 (~3.5 months at listing) after a 2025 private beta; spot trading and staking added Dec 2025–Jan 2026."}
- {id: P03, score: 3, confidence: high, evidence: [LIT-20, LIT-21, LIT-22], assessor: "agent:claude", rationale: "Original design: an app-specific Ethereum ZK-rollup whose custom Plonky2 circuits prove order matching and liquidations, not a fork; no peer-reviewed research."}
- {id: P04, score: 2, confidence: high, evidence: [LIT-12, LIT-11], assessor: "agent:claude", rationale: "Sequencer database failed for ~4.5h in the 10 Oct 2025 crash (known weak point, upgrade postponed), and the prover lagged the sequencer on 30 Dec, delaying withdrawals."}
- {id: P05, score: 2, confidence: medium, evidence: [LIT-24, LIT-11, LIT-23], assessor: "agent:claude", rationale: "Single operator runs sequencer and prover; Ethereum is the settlement/DA layer with a 14-day desert-mode fallback; fast exits route via Arbitrum. Oracle sources were not documented in dated sources."}
- {id: P08, score: 2, confidence: medium, evidence: [LIT-24, LIT-26, LIT-25], assessor: "agent:claude", rationale: "Circuit open-sourcing promised in '1–2 weeks' on 8 Oct 2025 arrived 26 Dec; desert-mode circuits still not public on 5 Jan 2026. Spot, token and staking did ship."}
- {id: P09, score: 2, confidence: high, evidence: [LIT-24, LIT-25, LIT-26], assessor: "agent:claude", rationale: "L1 contracts are verified and perp/spot circuits are public, but desert circuits are closed and L2BEAT had not reproduced the deployed verifiers; the matching engine is off-chain and closed."}
- {id: P10, status: pending, rationale: "missing: dated review of docs.lighter.xyz (technical specs, API, risk docs) as of Jan 2026"}

# --- S Security
- {id: S02, score: 2, confidence: high, evidence: [LIT-21, LIT-22, LIT-23, LIT-25], assessor: "agent:claude", rationale: "All six high findings across three 2025 zkSecurity circuit audits were fixed (one low left open), but no audit of the L1 contracts or token was found and the deployed verifiers were not independently matched to source."}
- {id: S05, score: 1, confidence: medium, evidence: [LIT-24, LIT-25], assessor: "agent:claude", rationale: "Network governor and upgrade-master role sit with one EOA; the 21-day upgrade delay can be skipped entirely by a team multisig whose threshold and signers are not disclosed."}
- {id: S06, status: pending, rationale: "missing: LIT token contract roles (owner/minter, mint function) and any L2-side mint/freeze powers; Etherscan not reachable"}
- {id: S08, score: 3, confidence: medium, evidence: [LIT-12, LIT-13, LIT-11, LIT-29], assessor: "agent:claude", rationale: "No exploit; the Oct 2025 outage (LLP also lost money) got a public loss breakdown and stablecoin+points compensation within days. Dec 2025 withdrawal delays were acknowledged only on Discord."}
- {id: S09, status: pending, rationale: "missing: dated description of the index/mark-price oracle, its fallbacks and whether signatures are verified on-chain"}
- {id: S10, score: 3, confidence: medium, evidence: [LIT-24, LIT-23, LIT-09], assessor: "agent:claude", rationale: "Funds sit in a validity-proved Ethereum rollup with an audited desert-mode exit, not a multisig bridge; ~$52M of exits went via Arbitrum, and the instant-upgrade path (S05) can override the exit."}

