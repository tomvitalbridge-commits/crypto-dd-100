# --- B Business Model
- {id: B02, score: 2, confidence: medium, evidence: [LIT-16, LIT-18], assessor: "agent:claude", rationale: "Revenue comes from premium accounts (market makers/HFT) paying for latency, not retail; organic, but concentrated in a professional segment and tied to volume cycles."}
- {id: B03, score: 3, confidence: medium, evidence: [LIT-06, LIT-31, LIT-30, LIT-01], assessor: "agent:claude", rationale: "Treasury Account #0 visibly bought ~180k LIT with USDC around 5–6 Jan, but the buyback was not formally confirmed, and the share of revenue used and the schedule are undisclosed."}
- {id: B09, status: pending, rationale: "missing: revenue split by account; premium/API fee payers are likely concentrated but no data published"}
- {id: B10, score: 2, confidence: medium, evidence: [LIT-16, LIT-09, LIT-18], assessor: "agent:claude", rationale: "Professional fee revenue (~$105–200M annualised) would remain, but much retail volume was points-driven and reportedly fell ~5× from the November peak around the airdrop."}

# --- C Competition & Moat
- {id: C01, score: 4, confidence: medium, evidence: [LIT-14, LIT-18], assessor: "agent:claude", rationale: "Perps are most of crypto trading volume; on-chain perps hit a record $1.2T in Oct 2025 and rose to >56% of DEX volume."}
- {id: C03, score: 2, confidence: medium, evidence: [LIT-29, LIT-18, LIT-10, LIT-28], assessor: "agent:claude", rationale: "Volume share went from launch to 27.7% (Nov) and ~20% (end-2025), but OI share was only 12.5%, the gain was paid for with a $675M points airdrop, and farmers were leaving by mid-January."}
- {id: C04, score: 2, confidence: medium, evidence: [LIT-18, LIT-16], assessor: "agent:claude", rationale: "Zero retail fees and ZK-verified matching are the moat; OI (~$1.4B vs Hyperliquid ~$8B) shows positions and liquidity did not follow volume, and retention after incentives is untested."}
- {id: C05, score: 2, confidence: medium, evidence: [LIT-26, LIT-18], assessor: "agent:claude", rationale: "Circuits are now open source and zero fees are easy to copy; liquidity and the LLP are the sticky parts."}
- {id: C06, score: 3, confidence: medium, evidence: [LIT-16, LIT-24, LIT-23], assessor: "agent:claude", rationale: "Versus Hyperliquid and Aster: free retail trading plus Ethereum settlement with ZK-proved execution and a proof-based escape hatch; the fee edge is copyable, the verifiability less so."}
- {id: C07, status: pending, rationale: "missing: peer FDV and fees on the same date (Hyperliquid, Aster) to compare with LIT's ~15.6× FDV/fees"}
- {id: C08, score: 2, confidence: low, evidence: [LIT-14, LIT-16], assessor: "agent:claude", rationale: "CEX perps dwarf DEX perps and Robinhood/Coinbase (both reported backers) could offer similar products; no competing native feature announced against Lighter specifically."}
- {id: C09, status: pending, rationale: "missing: live partner integrations with observable flows; announced relationships are investors, not integrations"}
- {id: C10, score: 3, confidence: low, evidence: [LIT-05, LIT-01, LIT-16], assessor: "agent:claude", rationale: "Adds a US-issued, Ethereum-settled perp-DEX token to Coinbase's Ethereum/Base focus; Coinbase is reported as a backer, a conflict the listing committee should record."}

