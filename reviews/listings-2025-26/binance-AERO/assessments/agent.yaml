# Aerodrome (AERO) — judgment scores from public sources, point-in-time as of 2026-07-17
# (Binance spot listing day). Every score cites evidence ids in evidence/*.json.
# Where public sources were not enough, the dimension is left `pending` with what is missing.
# T02, M05 and L07 are human-only and deliberately not filled.
assessments:

# --- T Team & Governance
- {id: T01, score: 3, confidence: medium, evidence: [AERO-20, AERO-13, AERO-06], assessor: "agent:claude", rationale: "The same team built Velodrome, the largest DEX on Optimism, and Aerodrome, the largest DEX on Base, both still running. Outcomes are verifiable; individual founders' earlier careers are not documented in sources found."}
- {id: T03, score: 2, confidence: medium, evidence: [AERO-11, AERO-13, AERO-01], assessor: "agent:claude", rationale: "Named CEO (Cutler), CFO (Wick) and foundation executive director, plus several engineers visible in git history; no documented succession, and public code activity rests on 3 contributors over 90 days."}
- {id: T04, score: 3, confidence: medium, evidence: [AERO-02, AERO-03, AERO-11], assessor: "agent:claude", rationale: "In-house team wrote and maintains the ve(3,3) v2 design (managed veNFTs, Aero Fed emissions), Slipstream and dynamic-fee modules, with public specs; most core math is adapted from Solidly and Uniswap V3."}
- {id: T05, score: 3, confidence: medium, evidence: [AERO-13, AERO-06, AERO-08], assessor: "agent:claude", rationale: "No enforcement, lawsuit or misconduct allegation found in press coverage; court records and team wallet histories were not checked, so not a 4."}
- {id: T07, score: 2, confidence: medium, evidence: [AERO-02, AERO-08], assessor: "agent:claude", rationale: "veAERO holders vote weekly and bindingly on emissions allocation and the tail rate, but the team multisig still holds pauser, fee-manager, factory-registry and vetoer roles; the vetoer renunciation is promised without a date."}
- {id: T08, status: pending, rationale: "missing: foundation/team treasury addresses and any periodic treasury or buyback report to reconcile against on-chain balances"}
- {id: T09, score: 3, confidence: low, evidence: [AERO-08], assessor: "agent:claude", rationale: "No private sale or VC allocation at genesis; one source names Coinbase Ventures (via the Base Ecosystem Fund) as an investor, with terms undisclosed."}

# --- P Product & Technology
- {id: P01, score: 3, confidence: medium, evidence: [AERO-08, AERO-09], assessor: "agent:claude", rationale: "Traders pay real fees (~$57M annualised in July 2026, >$17B 30d volume), but the liquidity side is paid for with AERO emissions."}
- {id: P02, score: 4, confidence: high, evidence: [AERO-20, AERO-06, AERO-07], assessor: "agent:claude", rationale: "Mainnet since August 2023 (~35 months) with Slipstream concentrated liquidity live since April 2024."}
- {id: P03, score: 2, confidence: high, evidence: [AERO-02, AERO-03, AERO-20], assessor: "agent:claude", rationale: "Fork of Velodrome V2 (Solidly lineage) and adapted Uniswap V3 pools, with meaningful additions: managed veNFTs, gauge-integrated CL pools, dynamic fee modules."}
- {id: P04, score: 3, confidence: medium, evidence: [AERO-02, AERO-15, AERO-06], assessor: "agent:claude", rationale: "Uses battle-tested constant-product and concentrated-liquidity designs; no contract exploit in ~3 years of production."}
- {id: P05, score: 2, confidence: medium, evidence: [AERO-18, AERO-15, AERO-20], assessor: "agent:claude", rationale: "Single-chain dependence on Base and its sequencer for the core business, and a centralised web domain that was hijacked twice (2023, 2025)."}
- {id: P08, score: 2, confidence: medium, evidence: [AERO-08, AERO-10, AERO-09, AERO-01], assessor: "agent:claude", rationale: "Slipstream and dynamic fees shipped, but the flagship Aero merger targeted for Q2 2026 was not live by 1 July 2026, and Predictive Allocation was still 'scheduled'."}
- {id: P09, score: 2, confidence: medium, evidence: [AERO-02, AERO-03], assessor: "agent:claude", rationale: "Contracts are public (GPL/Apache, gauges BUSL); the reviewer could not confirm deployed bytecode matches a tagged commit."}
- {id: P10, score: 3, confidence: medium, evidence: [AERO-02, AERO-03], assessor: "agent:claude", rationale: "Repos ship a specification, an exhaustive admin-permissions list and a voting-escrow spec; no threat model found."}

# --- S Security
- {id: S02, status: pending, rationale: "missing: finding-by-finding remediation status in the Spearbit (2023) and ChainSecurity (2025) reports, and confirmation that Base deployments match the audited commits"}
- {id: S05, score: 2, confidence: medium, evidence: [AERO-02, AERO-03, AERO-08], assessor: "agent:claude", rationale: "Admin powers sit with a team multisig and an Emergency Council multisig, not an EOA; threshold and signer independence unknown; powers include pausing v1 swaps and swapping fee modules with no timelock."}
- {id: S06, score: 3, confidence: medium, evidence: [AERO-02, AERO-06, AERO-07], assessor: "agent:claude", rationale: "Only the Minter contract can mint, on a coded schedule that veAERO voters can nudge by 1 bp of supply per week; no freeze or blacklist function. Supply is uncapped."}
- {id: S08, score: 1, confidence: medium, evidence: [AERO-15, AERO-16, AERO-17, AERO-18, AERO-19], assessor: "agent:claude", rationale: "Contracts never exploited, but users lost ~$700K (Nov 2025) and >$40K (Nov 2023) to two DNS hijacks of the official front end; compensation grants were announced but no payout found."}
- {id: S09, score: 3, confidence: medium, evidence: [AERO-02, AERO-03], assessor: "agent:claude", rationale: "Swaps do not depend on an external price oracle; risk sits with third parties that read Aerodrome pool prices, not with the DEX's own solvency."}
- {id: S10, score: 3, confidence: medium, evidence: [AERO-02, AERO-10], assessor: "agent:claude", rationale: "AERO is minted natively on Base; the planned Aero expansion to Ethereum and Arc would add cross-chain exposure that is not yet live."}

