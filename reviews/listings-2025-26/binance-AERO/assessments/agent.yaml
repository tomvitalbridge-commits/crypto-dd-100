# --- C Competition & Moat
- {id: C01, score: 3, confidence: medium, evidence: [AERO-11, AERO-08], assessor: "agent:claude", rationale: "Spot DEX trading is a large segment ($613B in Oct 2025), but Base DEX volume had fallen ~50% from its Oct 2025 peak."}
- {id: C03, score: 2, confidence: low, evidence: [AERO-08, AERO-09], assessor: "agent:claude", rationale: "Base DEX share fell from 72% (Q4-2024) to a ~39% trough before recovering to 43-53% in May 2026; the sources disagree on the latest level."}
- {id: C04, score: 2, confidence: medium, evidence: [AERO-08, AERO-07], assessor: "agent:claude", rationale: "Bribe/emission marketplace and Base-native liquidity give a moat, but Uniswap took share to ~32% while Aerodrome fell from 72% to ~43%."}
- {id: C05, score: 2, confidence: medium, evidence: [AERO-03, AERO-20], assessor: "agent:claude", rationale: "Code is forkable (Aerodrome is itself a fork; gauges are BUSL-licensed), but liquidity depth and the bribe market are sticky; no fork that took share was found."}
- {id: C06, score: 2, confidence: medium, evidence: [AERO-07, AERO-13], assessor: "agent:claude", rationale: "Versus Uniswap, projects can buy liquidity through bribes rather than seed it themselves; one axis, and other ve(3,3) DEXs can copy it."}
- {id: C07, score: 2, confidence: medium, evidence: [AERO-08], assessor: "agent:claude", rationale: "Q1-2026 price/sales ~2.2x circulating vs Uniswap 2.3x; on FDV 4.6x vs 3.3x — roughly in line."}
- {id: C08, score: 2, confidence: medium, evidence: [AERO-08, AERO-14], assessor: "agent:claude", rationale: "Base was 'exploring' a native token (Sep 2025) and Uniswap competes on the same chain; no competing native DEX from Coinbase/Base found."}
