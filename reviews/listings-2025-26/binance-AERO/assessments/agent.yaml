- {id: K09, score: 2, confidence: medium, evidence: [AERO-08, AERO-02], assessor: "agent:claude", rationale: "Minting is on-chain and formulaic, but providers disagree on circulating supply (~958M vs ~1.25B) and the team lock was not verified on-chain."}
- {id: K10, score: 3, confidence: medium, evidence: [AERO-02, AERO-07], assessor: "agent:claude", rationale: "The 10% airdrop went out as locked veAERO (AirdropDistributor creates locked NFTs), so recipients could not dump on day one; post-unlock retention not measured."}

