# REAL project, PUBLIC sources only, POINT-IN-TIME review.
# Binance listed MMT spot on 2025-11-04 12:00 UTC (Seed Tag, HODLer Airdrops #56).
# Only information published on or before 2025-11-04 is used. Sources were
# retrieved in 2026, but every excerpt is limited to pre-listing content.
# No `collect:` block on purpose: the collectors pull CURRENT market data,
# which would leak post-listing outcomes into a blind review.
