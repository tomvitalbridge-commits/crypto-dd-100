# Why some metrics are deliberately NOT set. Each becomes a note in the report.
notes:
  S06: "mint_authority not established. GWEI exists on Ethereum (0x2798b1cC5A993085E8A9D46e80499F1B63f42204, GWEI-08) and BNB Smart Chain (0x30117e4bc17d7b044194b76a38365c53b72f7d49, GWEI-09). Etherscan/BscScan and RPC endpoints were unreachable for this review, so mint, owner, pause and blacklist functions were not read. The 'fixed 10B supply' is only the project's statement. This critical gate stays UNCHECKED."
  S03: "contracts_verified not established for the same reason (explorers unreachable). Must be checked on both chains before sign-off."
  L03: "sanctions_exposure needs the venue's own Chainalysis/TRM screening of deployer, Foundation, team and top-holder addresses."
  S04: "upgrade_timelock_hours unknown: whether the token, collateral and pool contracts are upgradeable was not read."
  S07: "No bug bounty programme found in sources dated to 2026-02-24; not set rather than set to 0."
  K03: "Top-holder concentration at listing needs a point-in-time holder snapshot with Foundation, vesting, exchange and bridge addresses labelled; not obtainable from current explorers without leaking post-listing state."
  K08: "Annual inflation not set: supply is announced as fixed, but mint authority is unverified (RF01) and staking-reward funding for veGWEI is undisclosed. Unlock-driven float growth is captured in K04."
  M01: "±2% depth, spread, 24h volume and 30d realised volatility at listing could not be found in any source dated on or before 2026-02-24; only later values exist, so they are omitted."
  O01: "No on-chain activity metric for ETHGas buyers/sellers exists in public pre-listing sources; the marketplace runs on an off-chain order book."
  B01: "No revenue figure published; The Block reports only the 5% fee rate (GWEI-01). FDV/fees cannot be computed."
  B06: "~$17M raised (pre-seed ~$5M + $12M seed, GWEI-01); burn and treasury holdings undisclosed, so runway and diversification are unknown."
  C02: "No category-share data for blockspace/preconfirmation venues in dated sources."
  D03: "Holder count at listing not available in a pre-listing source."
  D07: "veGWEI governance had no recorded votes before listing."
  P06: "GitHub activity not collected: the API was restricted in this environment, and 90-day commit counts would have to be reconstructed as of 2026-02-24."
