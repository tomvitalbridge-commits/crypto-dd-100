# ETHGas (GWEI) — judgment scores from public sources, point-in-time as of 2026-02-24
# (Coinbase spot listing day). Only sources dated on or before that day are cited.
# Where public sources were not enough, the dimension is left `pending` with what is missing.
# Human-only dimensions T02, M05, L07 are deliberately absent.
assessments:

# --- T Team & Governance
- {id: T01, score: 2, confidence: medium, evidence: [GWEI-07, GWEI-19, GWEI-01], assessor: "agent:claude", rationale: "Founder led structured derivatives at Morgan Stanley and Barclays; his previous crypto venture, Infinity Exchange ($4.2M seed, 2022), reached no reported scale and is now paused."}
- {id: T03, score: 2, confidence: medium, evidence: [GWEI-01, GWEI-03], assessor: "agent:claude", rationale: "18 contributors, about half in Hong Kong, with staff from Morgan Stanley, Deutsche Bank, HKEx and Lockheed; the founder is the only named person in every source, so key-person risk sits with him."}
- {id: T04, score: 2, confidence: medium, evidence: [GWEI-15, GWEI-20, GWEI-03], assessor: "agent:claude", rationale: "In-house team built the Commit-Boost module and order book; public technical output is limited to forum posts and one co-authored ethresear.ch post."}
- {id: T05, score: 3, confidence: low, evidence: [GWEI-01, GWEI-07, GWEI-19], assessor: "agent:claude", rationale: "No misconduct or enforcement found in press coverage 2023–Feb 2026; court records and team wallets were not checked, and why Infinity Exchange was paused is not explained."}
- {id: T07, score: 1, confidence: medium, evidence: [GWEI-04, GWEI-05, GWEI-15], assessor: "agent:claude", rationale: "veGWEI governance was only announced at TGE; the marketplace is a central limit order book run by ETHGas, and insiders plus the liquid 8% Foundation hold 59% of supply."}
- {id: T08, status: pending, rationale: "missing: Foundation/treasury addresses or any treasury report; none found in sources dated to 2026-02-24"}
- {id: T09, score: 3, confidence: high, evidence: [GWEI-01, GWEI-03], assessor: "agent:claude", rationale: "Seed led by Polychain with BlueYard, Stake Capital, Amber, SIG DT and Lafayette; sold as a SAFT with no valuation disclosed and no board seats."}

# --- P Product & Technology
- {id: P01, score: 1, confidence: medium, evidence: [GWEI-01, GWEI-02, GWEI-03], assessor: "agent:claude", rationale: "Gas-cost hedging and guaranteed inclusion are real problems, but no buyer-side usage figure is public; the $800M 'commitments' are validator supply, not demand."}
- {id: P02, score: 2, confidence: medium, evidence: [GWEI-01, GWEI-02, GWEI-15], assessor: "agent:claude", rationale: "Blockspace futures launched on mainnet in Dec 2025, but the founder said full rollout was due Q1 2026 and execution guarantees were not broadly deployed before Jan/Feb 2026."}
- {id: P03, score: 3, confidence: medium, evidence: [GWEI-15, GWEI-17], assessor: "agent:claude", rationale: "Forward market for whole blocks and preconfirmations up to 64 slots ahead plus base-fee futures is an original design; per-transaction preconfirmations already exist elsewhere (mev-commit)."}
- {id: P04, score: 2, confidence: medium, evidence: [GWEI-02, GWEI-15], assessor: "agent:claude", rationale: "Out-of-protocol design that relies on relays and builders enforcing constraints, with fallback to a conforming block; the founder concedes 'centralizing vectors' and the 99.96% delivery figure is unverified."}
- {id: P05, score: 2, confidence: medium, evidence: [GWEI-15, GWEI-16, GWEI-02], assessor: "agent:claude", rationale: "Depends on Commit-Boost, MEV-Boost relays/builders and EigenLayer collateral; the PBS fallback is a partial safeguard."}
- {id: P08, score: 1, confidence: medium, evidence: [GWEI-15, GWEI-16, GWEI-01], assessor: "agent:claude", rationale: "Mainnet was targeted for Q1 2025 and full rollout slipped to Q1 2026; audit reports promised 'shortly' in Feb 2025 were still not public."}
- {id: P09, status: pending, rationale: "missing: public repositories and Etherscan/BscScan source-verification status of the token, collateral and pool contracts (explorers unreachable for this review)"}
- {id: P10, status: pending, rationale: "missing: ETHGas technical documentation (docs site not retrieved); only forum posts reviewed"}

