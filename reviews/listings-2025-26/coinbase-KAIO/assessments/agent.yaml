# --- L Legal & Compliance
- {id: L01, score: 2, confidence: medium, evidence: [KAIO-09, KAIO-15, KAIO-01], assessor: "agent:claude", rationale: "HQ in ADGM, a Singapore VCC fund entity and LibreCo Holdings are identifiable; the issuer of the KAIO token (KAIO Foundation) has no stated jurisdiction."}
- {id: L02, score: 2, confidence: low, evidence: [KAIO-05, KAIO-01, KAIO-16], assessor: "agent:claude", rationale: "Marketed as governance/access with no fee rights; team and investors hold 42% (45.5% with pre-TGE sale buyers), and the platform is centrally administered."}
- {id: L04, score: 2, confidence: medium, evidence: [KAIO-17, KAIO-15, KAIO-09], assessor: "agent:claude", rationale: "KAIO holds no licences itself and relies on a MAS-regulated manager and third-party administrators; distribution is said to run under CIMA/MAS frameworks, but no ADGM licence is named."}
- {id: L05, score: 3, confidence: medium, evidence: [KAIO-19, KAIO-08, KAIO-11], assessor: "agent:claude", rationale: "No regulator action on VARA's list and none in press coverage; FSRA, MAS and court records were not searched directly."}
- {id: L06, score: 4, confidence: medium, evidence: [KAIO-15, KAIO-13, KAIO-11], assessor: "agent:claude", rationale: "No privacy features; fund tokens transfer only between KYC'd, allowlisted investors."}
- {id: L08, score: 2, confidence: medium, evidence: [KAIO-15, KAIO-12, KAIO-21], assessor: "agent:claude", rationale: "For LUMA: a segregated Singapore VCC sub-fund with units at J.P. Morgan SE and an EY audit, but bankruptcy remoteness rests on non-reliance opinions. The other feeders' custody structures are not disclosed."}
- {id: L09, score: 1, confidence: medium, evidence: [KAIO-15, KAIO-18], assessor: "agent:claude", rationale: "An independent administrator strikes a daily NAV and EY audits annually, but no published attestation or proof of reserves for the fund tokens was found."}
- {id: L10, score: 2, confidence: low, evidence: [KAIO-15, KAIO-11], assessor: "agent:claude", rationale: "Fund tokens enforce investor and jurisdiction allowlists; no geographic restrictions were found for the KAIO token's distribution or trading."}
