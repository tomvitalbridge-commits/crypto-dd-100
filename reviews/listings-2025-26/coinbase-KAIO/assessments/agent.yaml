# Kaio (KAIO) — judgment scores from public sources, as of 2026-05-06 (Coinbase listing day, also TGE day).
# Every score cites evidence ids in evidence/*.json. Only sources published on or
# before 2026-05-06 are cited (undated living docs are flagged in their excerpts).
# Where public sources were not enough, the dimension is left `pending` with what is missing.
# KAIO is the governance token of a tokenised-fund distribution platform; L08/L09
# assess the fund tokens the platform issues, not the KAIO token itself.
assessments:

# --- T Team & Governance
- {id: T01, score: 2, confidence: low, evidence: [KAIO-13, KAIO-09, KAIO-14], assessor: "agent:claude", rationale: "Founded in 2024 by Avtar Sehra as a Laser Digital/WebN venture; the CEO named in April 2026 is Shrey Rastogi. The platform itself has shipped, but the founders' earlier ventures and their outcomes are not documented in the sources."}
- {id: T03, score: 2, confidence: low, evidence: [KAIO-09, KAIO-10, KAIO-20, KAIO-13], assessor: "agent:claude", rationale: "Three named executives (CEO Rastogi, COO Dang, CTO Surana since Oct 2025); the founding CEO is no longer named, and headcount is not disclosed."}
- {id: T04, score: 2, confidence: low, evidence: [KAIO-20, KAIO-16], assessor: "agent:claude", rationale: "A CTO joined in Oct 2025 and the docs describe a role-based registry design, but no public specs, research or code from the technical team were found."}
- {id: T05, score: 3, confidence: medium, evidence: [KAIO-19, KAIO-08, KAIO-11], assessor: "agent:claude", rationale: "No VARA notice and no allegations in 2024–26 press coverage; court records, other regulators and wallet history were not checked, so not a 4."}
- {id: T07, score: 1, confidence: medium, evidence: [KAIO-01, KAIO-05, KAIO-16], assessor: "agent:claude", rationale: "The KAIO Foundation was set up in Apr 2026 and token voting is promised but not live at TGE; on the platform a KAIO Admin role sits at the top of all permissions."}
- {id: T08, status: pending, rationale: "missing: Foundation/treasury and vesting wallet addresses; the token docs page and Etherscan were not accessible for this review"}
- {id: T09, score: 3, confidence: high, evidence: [KAIO-08, KAIO-09, KAIO-14], assessor: "agent:claude", rationale: "Incubated by Laser Digital (Nomura) and WebN (Alan Howard); $19M raised in total; the $8M round in Apr 2026 brought in Tether and Systemic Ventures, with existing investors Further Ventures and Laser Digital (WebN is the incubator, not a round participant). Round terms are undisclosed, and early investors hold 31% of supply."}

# --- P Product & Technology
- {id: P01, score: 2, confidence: medium, evidence: [KAIO-08, KAIO-11, KAIO-17], assessor: "agent:claude", rationale: "Real problem (on-chain access to institutional funds), but two years in, AUM is about $108.5M, against claims of more than $200M issued, so demand looks modest."}
- {id: P02, score: 3, confidence: high, evidence: [KAIO-14, KAIO-13, KAIO-11], assessor: "agent:claude", rationale: "Fund tokens have been live since Mar 2024 on several chains; the AppChain, staking, governance and the KASH retail product are not live at TGE."}
- {id: P03, score: 2, confidence: medium, evidence: [KAIO-15, KAIO-16], assessor: "agent:claude", rationale: "Permissioned register on a sidechain plus an allowlisted mainnet gateway: a standard tokenised-fund design with custom role registries, no published research."}
- {id: P04, score: 2, confidence: medium, evidence: [KAIO-15], assessor: "agent:claude", rationale: "Off-chain administrator keeps the authoritative register and can rebuild it; on-chain tokens are receipts minted/locked through a gateway, which works but has manual and liveness limits."}
- {id: P05, score: 2, confidence: medium, evidence: [KAIO-15, KAIO-10], assessor: "agent:claude", rationale: "Depends on fund administrators, underlying managers, Circle off-ramp and LayerZero for multi-chain supply; the administrator's off-chain records are the fallback."}
- {id: P08, score: 2, confidence: low, evidence: [KAIO-10, KAIO-17, KAIO-08, KAIO-05], assessor: "agent:claude", rationale: "Chain launches shipped (Solana, Aptos, Sei), but the $500M Telegram Bond Fund (announced Apr 2025) has no visible launch, and KASH is still on a waitlist that opened Feb 2026."}
- {id: P09, status: pending, rationale: "missing: public code repository and explorer verification of the KAIO token and gateway contracts"}
- {id: P10, score: 2, confidence: medium, evidence: [KAIO-16, KAIO-17], assessor: "agent:claude", rationale: "Docs describe registries and access roles but say nothing on upgradeability, admin keys or the KAIO token, and give conflicting asset figures."}

# --- S Security
- {id: S02, status: pending, rationale: "missing: the Nethermind report itself (date, scope, commit, findings) and whether it covers deployed gateway and KAIO token contracts"}
- {id: S05, status: pending, rationale: "missing: who holds KAIO Admin and token/proxy admin rights, multisig threshold and signers"}
- {id: S06, status: pending, rationale: "missing: on-chain read of the KAIO ERC-20 (mint, pause, blacklist, owner). Fund tokens carry allowlist controls by design (KAIO-15)."}
- {id: S08, status: pending, rationale: "missing: incident-database check; no exploit appears in 2024–26 coverage, but absence in press is not proof"}
- {id: S09, score: 2, confidence: low, evidence: [KAIO-15, KAIO-18], assessor: "agent:claude", rationale: "Fund token value is set by an independent administrator's daily NAV rather than a market oracle; no on-chain NAV feed or fallback is documented, and KAIO assets are not Horizon collateral."}
- {id: S10, score: 2, confidence: medium, evidence: [KAIO-10, KAIO-15], assessor: "agent:claude", rationale: "Fund tokens move across 10+ chains through a sidechain gateway and LayerZero; the KAIO token itself is a single ERC-20 on Ethereum."}

