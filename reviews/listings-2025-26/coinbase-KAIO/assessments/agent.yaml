- {id: C09, score: 2, confidence: medium, evidence: [KAIO-12, KAIO-18, KAIO-10, KAIO-17], assessor: "agent:claude", rationale: "Hamilton Lane confirms a live feeder; Aave Horizon lists no KAIO collateral, and the $500M Telegram Bond Fund and $100M BTC fund are unverified announcements."}
