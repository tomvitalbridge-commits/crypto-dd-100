- {id: C06, score: 2, confidence: low, evidence: [KAIO-11, KAIO-10], assessor: "agent:claude", rationale: "Multi-manager feeder access across 10+ chains is the stated edge; Securitize already brings sponsor-backed funds to the same chains (Apollo on Sei)."}
- {id: C07, status: pending, rationale: "missing: listing price/FDV and peer valuations as of 6 May 2026"}
