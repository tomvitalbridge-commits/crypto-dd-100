- {id: T09, score: 3, confidence: medium, evidence: [E21], assessor: "agent:claude", rationale: "Established funds led both rounds and supported the team through the 2025 drawdown; no strategic exchange or ecosystem backer."}

# --- P Product & Technology
- {id: P01, score: 3, confidence: high, evidence: [E03, E08], assessor: "agent:claude", rationale: "Isolated markets serve long-tail collateral that pooled lenders reject; 27% 30-day retention and growing fees without proportional incentives."}
- {id: P02, score: 4, confidence: high, evidence: [E01, E04], assessor: "agent:claude", rationale: "Mainnet since March 2024 (31 months) on two chains with v2 in production."}
- {id: P03, score: 3, confidence: medium, evidence: [E01, E11], assessor: "agent:claude", rationale: "Original curator-based isolated-market design with Dutch-auction liquidations; builds on known patterns rather than new research."}
- {id: P04, score: 3, confidence: high, evidence: [E05, E07], assessor: "agent:claude", rationale: "Formally verified solvency invariants; per-market isolation limits contagion. Curator-set parameters remain a design-level risk."}
- {id: P05, score: 3, confidence: high, evidence: [E01, E06], assessor: "agent:claude", rationale: "Chainlink primary with TWAP fallback and deviation breaker; dependent on Arbitrum sequencer for the L2 deployment."}
- {id: P08, score: 3, confidence: medium, evidence: [E01, E11], assessor: "agent:claude", rationale: "v2 and fee switch shipped, both about one quarter late; cross-chain markets still on the roadmap."}
- {id: P09, score: 4, confidence: high, evidence: [E11, E04], assessor: "agent:claude", rationale: "Contracts, bots and subgraph open source; tagged release reproduces deployed bytecode."}
- {id: P10, score: 3, confidence: medium, evidence: [E01], assessor: "agent:claude", rationale: "Solid integration and risk docs; no published threat model."}

