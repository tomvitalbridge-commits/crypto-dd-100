- {id: T03, score: 3, confidence: medium, evidence: [E13, E11], assessor: "agent:claude", rationale: "23 FTE with 2 dedicated security engineers; liquidation-engine design still concentrated in the CTO with a shadow in place."}
- {id: T04, score: 4, confidence: high, evidence: [E11, E07], assessor: "agent:claude", rationale: "In-house team wrote the formally verified solvency invariants and maintains reproducible builds."}
- {id: T05, score: 3, confidence: medium, evidence: [E17], assessor: "agent:claude", rationale: "No enforcement or litigation; one 2025 front-running allegation reviewed by an independent delegate with no on-chain support."}
- {id: T07, score: 3, confidence: high, evidence: [E12, E04], assessor: "agent:claude", rationale: "Binding Governor with quorum and 2-day timelock; vote power concentrated (top 3 voters 41%, two team-adjacent)."}
