# --- B Business Model
- {id: B02, score: 3, confidence: medium, evidence: [H08, H45], assessor: "agent:claude", rationale: "Revenue is organic trading fees, but cyclical: gross revenue fell from $457M (Q3-25) to $202M (Q2-26)."}
- {id: B03, score: 4, confidence: high, evidence: [H02, H07], assessor: "agent:claude", rationale: "All protocol revenue accrues to holders: Q3-26 $151M of $174M bought back HYPE on-chain; the rest was USDC reserve yield and burns."}
- {id: B09, score: 2, confidence: medium, evidence: [H43, H44], assessor: "agent:claude", rationale: "HIP-3 is ~37.5% of volume and one deployer does ~96% of HIP-3 — roughly a third of volume runs through a single partner."}
- {id: B10, score: 3, confidence: medium, evidence: [H02, H05], assessor: "agent:claude", rationale: "No usage incentives, so fees are real; but staking emissions (~9.9M HYPE/yr) about equal buybacks, so holders see little net supply reduction."}

# --- C Competition & Moat
- {id: C01, score: 4, confidence: medium, evidence: [H54, H09], assessor: "agent:claude", rationale: "Perps are crypto's largest market; Hyperliquid alone reached 6.63% of global perp volume including CEXs."}
- {id: C03, score: 2, confidence: medium, evidence: [H10, H12, H46], assessor: "agent:claude", rationale: "Volume share fell from ~44% (Mar 2026) to 32.8% (Oct 2026); OI share stable at ~55–57%."}
- {id: C04, score: 3, confidence: medium, evidence: [H46, H10, H51], assessor: "agent:claude", rationale: "Volume share fell from 33% to ~10% in late 2025 as Lighter (zero fees) and Aster surged, then recovered to ~33% without incentives; Aster's volume data was delisted by DefiLlama over wash-trading concerns."}
- {id: C05, score: 3, confidence: medium, evidence: [H20, H10], assessor: "agent:claude", rationale: "Closed-source core can't be forked directly, and OI/liquidity concentration is hard to replicate."}
- {id: C06, score: 3, confidence: medium, evidence: [H43, H11], assessor: "agent:claude", rationale: "CEX-like order book with self-custody plus permissionless markets (RWA/equity perps) competitors don't match yet."}
- {id: C07, score: 2, confidence: medium, evidence: [H01, H02], assessor: "agent:claude", rationale: "FDV/fees ~82× vs Aster ~28× and Lighter ~40× on trailing fees; on market cap (~19×) it is cheaper."}
- {id: C08, score: 2, confidence: medium, evidence: [H54, H47], assessor: "agent:claude", rationale: "Competes head-on with CEX perps (incl. Binance); Coinbase chose to partner instead."}
- {id: C09, score: 3, confidence: medium, evidence: [H32, H54, H38], assessor: "agent:claude", rationale: "Coinbase USDC deployer and Base App routing are live, ETFs trade; the USDH partnership was reversed eight months after it was voted in."}
- {id: C10, score: 3, confidence: medium, evidence: [H15, H16, H47], assessor: "agent:claude", rationale: "Top-demand asset users already trade as a Binance perp since May 2025; spot adds a TRY fiat route but lists a direct competitor's token."}

